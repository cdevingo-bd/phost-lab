[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phost-lab"
version = "0.1.0.dev0"
description = "Run a graph of phost implementations on a scene in an isolated worker: step time, speedup and accuracy against a native control, plus per-phase profile, where a change could pay, and where it applies."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["phost", "numpy>=1.24"]

[project.optional-dependencies]
mjwarp = ["mujoco", "mujoco-warp", "warp-lang"]
test = ["pytest>=7"]

[project.scripts]
phost-lab = "phost_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
